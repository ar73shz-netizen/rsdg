<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدیریت فردی</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'VazirLocal';src:url('fonts/Vazirmatn.woff2') format('woff2');font-weight:100 900}
@font-face{font-family:'LalezarLocal';src:url('fonts/Lalezar.woff2') format('woff2')}
:root{--bg:#f1f4f9;--card:rgba(255,255,255,.42);--tx:#16233f;--mu:#5d6b86;--bd:rgba(60,80,140,.18);--bar:linear-gradient(135deg,#6d28d9,#c084fc);--bt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--card:rgba(255,255,255,.1);--tx:#e9eefb;--mu:#98a6c4;--bd:rgba(140,160,255,.22)}}
:root[data-theme="dark"]{--bg:#0f1524;--card:rgba(255,255,255,.1);--tx:#e9eefb;--mu:#98a6c4;--bd:rgba(140,160,255,.22)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:var(--bg)}
body{display:flex;flex-direction:column;font:17px/1.75 'VazirLocal','Vazirmatn',Tahoma,sans-serif;color:var(--tx);background:transparent}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(520px 420px at 92% 4%,rgba(139,92,246,.38),transparent 62%),radial-gradient(480px 420px at 4% 28%,rgba(34,211,238,.34),transparent 62%),radial-gradient(540px 480px at 88% 68%,rgba(244,114,182,.34),transparent 62%),radial-gradient(480px 420px at 6% 96%,rgba(250,204,21,.30),transparent 62%),linear-gradient(180deg,#EEF0FF,#F7EFFF)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before{background:radial-gradient(520px 420px at 92% 4%,rgba(139,92,246,.3),transparent 62%),radial-gradient(480px 420px at 4% 28%,rgba(34,211,238,.22),transparent 62%),radial-gradient(540px 480px at 88% 68%,rgba(244,114,182,.24),transparent 62%),linear-gradient(180deg,#11152a,#1a1234)}}
:root[data-theme="dark"] body::before{background:radial-gradient(520px 420px at 92% 4%,rgba(139,92,246,.3),transparent 62%),radial-gradient(480px 420px at 4% 28%,rgba(34,211,238,.22),transparent 62%),radial-gradient(540px 480px at 88% 68%,rgba(244,114,182,.24),transparent 62%),linear-gradient(180deg,#11152a,#1a1234)}
header,nav{background:var(--bar);color:var(--bt)}
header{position:relative;overflow:hidden;padding:14px 18px 16px;display:flex;align-items:center;gap:10px;border-radius:0 0 22px 22px;box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:2}
header img{width:60px;height:60px;border-radius:12px;object-fit:cover;box-shadow:0 2px 10px rgba(0,0,0,.3)}
h1{font:400 25px 'LalezarLocal','Lalezar','VazirLocal','Vazirmatn',sans-serif;margin:0;flex:1;line-height:1.3}
.dt{font-size:11px;opacity:.9;font-weight:400}
h3,h4{margin:14px 0 4px}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gb{border:0;background:rgba(127,127,127,.22);color:var(--bt);border-radius:12px;width:40px;height:40px;font-size:18px;display:flex;align-items:center;justify-content:center}
.tt{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
.t{flex:0 0 auto;border-radius:14px;padding:8px 16px;background:var(--card);color:var(--tx);font:inherit;font-family:'LalezarLocal','Lalezar','VazirLocal','Vazirmatn',sans-serif;font-size:18px;border:1px solid var(--bd)}
.t.on{background:var(--bar);color:var(--bt);border-color:transparent}
main{flex:1;overflow:auto;padding:14px;background:transparent}
nav{position:relative;overflow:hidden;display:flex;padding:8px 9px 10px;border-radius:22px 22px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.18);z-index:2}
.bi{flex:1;display:flex;flex-direction:column;align-items:center;font:inherit;font-family:'LalezarLocal','Lalezar','VazirLocal','Vazirmatn',sans-serif;font-size:16px;color:inherit;background:none;border:0;border-radius:14px;padding:8px 0;opacity:.85}
.bi.on{opacity:1;background:rgba(127,127,127,.25);font-weight:800}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 13px;margin:8px 0}
.c.r{background:rgba(224,76,91,.2);border-color:rgba(224,76,91,.5)}.c.y{background:rgba(234,164,42,.2);border-color:rgba(234,164,42,.5)}.c.g{background:rgba(47,182,117,.2);border-color:rgba(47,182,117,.5)}
.fx{display:flex;gap:10px;align-items:center}
.b{border:0;border-radius:12px;padding:9px 14px;background:var(--bar);color:var(--bt);font:inherit;font-family:'LalezarLocal','Lalezar','VazirLocal','Vazirmatn',sans-serif;font-size:19px;flex:1;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.b.g2{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.b.no{background:#dc2626;color:#fff}
.row{display:flex;gap:8px;margin:8px 0;align-items:center}
.ov{position:fixed;inset:0;background:rgba(8,12,30,.55);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.md{background:var(--bg);border-radius:18px;padding:16px;width:100%;max-width:420px;max-height:92%;overflow:auto;border:1px solid var(--bd)}
.md h3{margin:0 0 8px}
input,select,textarea{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:2px 0 8px}
input[type=checkbox]{width:auto}
label{font-size:12px;color:var(--mu)}
.mu{color:var(--mu);font-size:12px}
.x{border:0;background:none;color:var(--tx);font-size:17px;padding:2px 6px}
.bar{height:6px;border-radius:4px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--bar)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal>div{font-size:12px;color:var(--mu)}
.cal>button{aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--bd);color:var(--tx);font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.cal .td{outline:2px solid #dc2626}.cal b{width:6px;height:6px;border-radius:50%;background:#dc2626}
.sq{width:32px;height:32px;border-radius:10px;border:2px solid var(--mu);background:none;font-size:18px;color:var(--tx);flex:none;padding:0}
.ok{color:#16a34a;font-weight:800}.nok{color:#dc2626;font-weight:800}.pt{color:#d98a0b}
.strike{text-decoration:line-through;opacity:.6}
.sl,.dp{display:flex;gap:6px;align-items:center}
.ts{position:fixed;top:70px;right:16px;left:16px;z-index:20;background:#16233f;color:#fff;border-radius:12px;padding:12px;text-align:center}
.cf{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.cf i{position:absolute;top:-14px;width:9px;height:15px;border-radius:2px;animation:fall 2.4s ease-in forwards}
.cf u{position:absolute;top:-30px;text-decoration:none;font-size:calc(24px*var(--s));animation:fall 2.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
.cf b{position:absolute;top:34%;width:100%;text-align:center;font:400 36px 'LalezarLocal','Lalezar',sans-serif;color:#fff;text-shadow:0 3px 14px #000,0 0 30px #f0f;animation:pop .7s cubic-bezier(.3,1.8,.5,1)}
.win{position:fixed;inset:0;z-index:31;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.18),rgba(5,8,25,.88) 68%);animation:winfade .35s ease-out}.winbox{width:min(92vw,390px);padding:28px 20px;border:1px solid rgba(255,220,120,.75);border-radius:28px;text-align:center;color:#fff;background:linear-gradient(145deg,rgba(35,20,65,.96),rgba(8,13,35,.96));box-shadow:0 0 55px rgba(255,190,40,.38),inset 0 0 25px rgba(255,255,255,.08);animation:pop .65s cubic-bezier(.3,1.8,.5,1)}.win-trophy{font-size:66px;filter:drop-shadow(0 0 18px #ffc84a)}.win-title{font:36px 'LalezarLocal','Lalezar',sans-serif;color:#ffdb75;margin:4px 0}.win-sub{font-size:15px;color:#fff}.win-points{font-size:18px;color:#ffe39a;margin-top:12px}@keyframes winfade{from{opacity:0}to{opacity:1}}
:root[data-tab='agenda'] header,:root[data-tab='agenda'] nav{background:linear-gradient(125deg,#9b28e8 0%,#ec2798 48%,#bd35e8 75%,#693be8 100%)}
:root[data-tab='kar'] header,:root[data-tab='kar'] nav{background:linear-gradient(110deg,#20c9df 0%,#54c9b6 28%,#c9d98a 48%,#f4df45 70%,#f58a24 88%,#ed5b18 100%);color:#173b39}
:root[data-tab='kar'] h1,:root[data-tab='kar'] .gb,:root[data-tab='kar'] .bi{color:#173b39}
:root[data-tab='kar'] .c,:root[data-tab='kar'] input,:root[data-tab='kar'] textarea,:root[data-tab='kar'] select,:root[data-tab='kar'] .t{background:linear-gradient(115deg,rgba(32,201,223,.20),rgba(84,201,182,.22),rgba(244,223,69,.24),rgba(245,138,36,.20));border-color:rgba(255,255,255,.8)}
header{padding-top:21px;padding-bottom:24px}nav{padding-top:12px;padding-bottom:14px}
.bi svg{width:25px;height:25px;stroke-width:2.5}.bi:nth-child(1) svg{color:#ffdc4d}.bi:nth-child(2) svg{color:#ff7b7b}.bi:nth-child(3) svg{color:#a8ffde}.bi:nth-child(4) svg{color:#ffe0a3}.bi:nth-child(5) svg{color:#d9c4ff}.bi:nth-child(6) svg{color:#ffb2dd}
#rewardBtn{font-size:20px;color:#ffdf69}

@keyframes pop{from{transform:scale(.2) rotate(-12deg);opacity:0}}
.tt.wr{flex-wrap:wrap;overflow:visible}.big2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.big2 .t{font-size:16px;padding:7px 10px;text-align:center}
@keyframes in{from{transform:translateY(12px) scale(.95);opacity:0}}.c{animation:in .35s}.sq{transition:transform .15s}.sq:active{transform:scale(1.3)}
.c,.md,.t,.b.g2,.ts{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.c{border:1px solid rgba(255,255,255,.75);box-shadow:0 8px 26px rgba(40,90,170,.16),inset 0 1px 0 rgba(255,255,255,.85)}
.md{background:color-mix(in srgb,var(--bg) 72%,transparent)}
header::after,nav::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 52%)}
.x svg,.b svg{width:20px;height:20px}.b svg{vertical-align:-4px}.dg{touch-action:none;color:var(--mu);display:flex;cursor:grab}
summary{cursor:pointer}
.move-controls{display:none!important}.dg{display:none!important}
</style>
</head>

const $=s=>document.querySelector(s);
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334];const g2=gm>2?gy+1:gy;let days=355666+365*gy+~~((g2+3)/4)-~~((g2+99)/100)+~~((g2+399)/400)+gd+g[gm-1];let jy=-1595+33*~~(days/12053);days%=12053;jy+=4*~~(days/1461);days%=1461;if(days>365){jy+=~~((days-1)/365);days=(days-1)%365}const jm=days<186?1+~~(days/31):7+~~((days-186)/30);const jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+~~(jy/33)*8+~~(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*~~(days/146097);days%=146097;if(days>36524){gy+=100*~~(--days/36524);days%=36524;if(days>=365)days++}gy+=4*~~(days/1461);days%=1461;if(days>365){gy+=~~((days-1)/365);days=(days-1)%365}let gd=days+1;const sal=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13&&gd>sal[gm];gm++)gd-=sal[gm];return[gy,gm,gd]}
const toJ=s=>{const d=parse(s);return g2j(d.getFullYear(),d.getMonth()+1,d.getDate())};
const fromJ=(y,m,d)=>{const g=j2g(y,m,d);return g[0]+'-'+pad(g[1])+'-'+pad(g[2])};
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const jfmt=s=>s?fa(toJ(s).join('/')):'';
const jlong=s=>{const j=toJ(s);return fa(j[2])+' '+MN[j[1]-1]+' '+fa(j[0])};
const dim=(y,m)=>m<7?31:m<12?30:(g2j(...j2g(y,12,30))[1]==12?30:29);
const dp=(n,s)=>{const j=toJ(s||today()),cy=toJ(today())[0],y0=Math.min(cy-1,j[0]),y1=Math.max(cy+5,j[0]);let ys='';for(let y=y0;y<=y1;y++)ys+=`<option value="${y}" ${y==j[0]?'selected':''}>${fa(y)}</option>`;
return `<div class="dp" data-n="${n}"><select>${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${j[2]==i+1?'selected':''}>${fa(i+1)}</option>`).join('')}</select><select>${MN.map((m,i)=>`<option value="${i+1}" ${j[1]==i+1?'selected':''}>${m}</option>`).join('')}</select><select>${ys}</select></div>`};
const dv=(m,n)=>{const s=m.querySelectorAll('[data-n='+n+'] select'),y=+s[2].value,mo=+s[1].value;return fromJ(y,mo,Math.min(+s[0].value,dim(y,mo)))};

function wsync(){try{if(!CAP.AgendaWidget)return;const d=today(),all=agItems(d),done=all.filter(x=>S.status[d+'|'+x.k]==1).length,l=all.slice(0,7).map(x=>{const t=S.status[d+'|'+x.k];return (t==1?'✓ ':t===0?'✗ ':'• ')+x.t});const head='امروز: '+done+'/'+all.length+' کار انجام شده';CAP.AgendaWidget.update({text:head+'\n'+(l.join('\n')||'برای امروز کاری ثبت نشده')})}catch(e){}}

let AC;const ctx=()=>AC=AC||new(window.AudioContext||webkitAudioContext)();
const tone=(f,t0,d,type,vol)=>{try{const c=ctx(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t0;o.type=type||'triangle';o.frequency.setValueAtTime(f,s);o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(vol||.28,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}};
const sTick=()=>{tone(1400,0,.06,'sine',.35);tone(2100,.05,.1,'sine',.25)},sCross=()=>{tone(220,0,.12,'square',.2);tone(160,.1,.2,'square',.2)};
function applause(d,vol){try{const c=ctx(),n=c.sampleRate*d,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);let e=0;for(let i=0;i<n;i++){if(i%2200==0)e=Math.random();a[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n)*(.2+.8*e*e)}const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();f.type='highpass';f.frequency.value=900;s.buffer=b;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(c.destination);s.start()}catch(e){}}

function celebration(kind,bonus){const r=S.rewards;if(r.settings.sound&&(kind==='check'||kind==='agenda'))fanfare();if(!r.settings.visual)return;const old=document.querySelector('.win');if(old)old.remove();const w=document.createElement('div');w.className='win';w.innerHTML=`<div class="winbox"><div class="win-trophy">🏆</div><div class="win-title">آفرین! فوق‌العاده بودی</div><div class="win-sub">${kind==='agenda'?'تمام دستور کار امروز انجام شد':kind==='check'?'چک‌لیست امروز کامل شد':'تمام کارهای این بخش انجام شد'}</div><div class="win-points">${kind==='check'?'🌟 استمرار تو ارزشمند است':'🪙 سکه‌های تلاش تو ثبت شد'}</div><div style="font-size:12px;color:#d8d5e5;margin-top:10px">تو هر روز از دیروز توانمندتری؛ همین‌طور ادامه بده!</div></div>`;document.body.appendChild(w);const c=document.createElement('div');c.className='cf';for(let i=0;i<85;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=['#ffd34e','#ff4fb8','#8d69ff','#fff'][i%4];e.style.setProperty('--dx',(Math.random()*220-110)+'px');e.style.animationDelay=Math.random()*.7+'s';c.appendChild(e)}document.body.appendChild(c);setTimeout(()=>{w.remove();c.remove()},4200);w.onclick=()=>{w.remove();c.remove()}}

function agF(id){const e=S.agenda.find(x=>x.id==id)||{};modal(id?'ویرایش کار':'کار جدید در دستور کار',`<label>عنوان</label><input name="t" value="${esc(e.t)}"><label>ارزش انجام کار (سکه)</label><input name="coinValue" type="number" min="0" value="${e.coinValue??10}"><label>توضیحات</label><textarea name="desc" rows="2">${esc(e.desc)}</textarea><label>تاریخ اضافه شدن به دستور کار</label>${dp('d',e.date||cd)}<label>ساعت (برای یادآوری)</label><input name="time" type="time" value="${e.time||''}"><label>یادآوری</label>${REM(e.remind)}<label>اهمیت</label>${PRI(e.pri)}`,m=>{const t=v(m,'t').trim();if(!t)return false;if(id)unsched(e);const o={id:e.id||uid(),nid:e.nid||nid(),t,desc:v(m,'desc'),date:dv(m,'d'),time:v(m,'time'),remind:v(m,'rem'),pri:v(m,'pri'),coinValue:Math.max(0,+v(m,'coinValue')||0),fired:0};id?Object.assign(e,o):S.agenda.push(o);save();sched(o);render()})}

function reorder(kind,keys){if(kind=='ag'){(S.ord=S.ord||{})[cd]=keys;return}const arr=kind.slice(0,2)=='i:'?S.items[kind.slice(2)]:S[kind];const ord=keys.map(k=>arr.find(x=>x.id==k));arr.map((x,i)=>keys.includes(x.id)?i:-1).filter(i=>i>=0).forEach((p,j)=>arr[p]=ord[j])}
function moveRow(kind,key,delta){
  const box=[...document.querySelectorAll('[data-sort]')].find(x=>x.dataset.sort===kind);
  if(!box)return;
  const keys=[...box.querySelectorAll(':scope > [data-k]')].map(x=>x.dataset.k);
  const from=keys.indexOf(key),to=from+delta;
  if(from<0||to<0||to>=keys.length)return;
  [keys[from],keys[to]]=[keys[to],keys[from]];
  reorder(kind,keys);save();render();
}

function secF(id){const s=S.secs.find(x=>x.id==id)||{f:{}};modal(id?'ویرایش بخش':'بخش جدید در کارپوشه',`<label>عنوان</label><input name="t" value="${esc(s.t)}"><label>ایموجی</label><input name="i" value="${esc(s.i||'⭐')}"><label>این بخش چه امکاناتی داشته باشد؟</label>`+FL.map(([k,n])=>`<div><label style="font-size:15px;color:var(--tx)"><input type="checkbox" name="f_${k}" ${s.f&&s.f[k]?'checked':''}> ${n}</label></div>`).join(''),m=>{const t=v(m,'t').trim();if(!t)return false;const f={};FL.forEach(([k])=>f[k]=m.querySelector('[name=f_'+k+']').checked);const o={t,i:v(m,'i')||'⭐',f};if(id)Object.assign(s,o);else{o.id='s'+uid();S.secs.push(o);ks=o.id}save();render()})}

async function backup(){const data=JSON.stringify(S),name='personal-manager-backup-'+today()+'.json';try{if(CAP.Filesystem){await CAP.Filesystem.writeFile({path:name,data,directory:'DOCUMENTS',encoding:'utf8'});return toast('پشتیبان در پوشه Documents گوشی ذخیره شد: '+name)}}catch(e){}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;a.click();toast('فایل پشتیبان ذخیره شد')}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.secs)throw 0;S=o;save();render();toast('اطلاعات بارگذاری شد ✅')}catch(e){toast('فایل پشتیبان معتبر نیست')}};r.readAsText(f)}
function vArch(){const lim=Date.now()-30*864e5;let h='<h3>🗄️ بایگانی کارهای انجام‌شده</h3>',any=0;
S.secs.forEach(s=>{const l=(S.items[s.id]||[]).filter(i=>i.done&&i.doneAt&&parse(i.doneAt)<lim);if(l.length){any=1;h+=`<h4>${s.i} ${esc(s.t)}</h4>`+l.map(i=>`<div class="c ${i.pri||'y'}"><span class="strike">${esc(i.t)}</span> <span class="mu">${jfmt(i.doneAt)}</span></div>`).join('')}});
if(!any)h+='<p class="mu">کارهای انجام‌شده، ۳۰ روز بعد از انجام اینجا بایگانی می‌شوند.</p>';
return h+'<h3>📊 گزارش و آمار چک‌لیست</h3>'+stat()}
function stat(){const Y={};Object.keys(S.log).sort().forEach(d=>{const j=toJ(d),a=Y[j[0]]=Y[j[0]]||{};(a[j[1]]=a[j[1]]||[]).push([d,S.log[d]])});
const agg=days=>{const A={};let D=0,T=0;days.forEach(r=>Object.values(r[1]).forEach(e=>{const a=A[e.n]=A[e.n]||[0,0],d=Math.min(e.d,e.t);a[0]+=d;a[1]+=e.t;D+=d;T+=e.t}));return[T?Math.round(D/T*100):0,Object.entries(A).map(([n,a])=>`<div class="mu">• ${esc(n)}: ${fa(a[0])} از ${fa(a[1])} دقیقه (${fa(a[1]?Math.round(a[0]/a[1]*100):0)}٪)</div>`).join('')]};
return Object.keys(Y).sort((a,b)=>b-a).map(y=>{const ms=Y[y],ya=agg(Object.values(ms).flat());return `<details class="c"><summary><b>سال ${fa(y)}</b> — ${fa(ya[0])}٪</summary>${ya[1]}`+Object.keys(ms).sort((a,b)=>b-a).map(m=>{const ma=agg(ms[m]);return `<details style="margin:6px 10px"><summary>${MN[m-1]} — ${fa(ma[0])}٪</summary>${ma[1]}`+ms[m].slice().reverse().map(r=>{const da=agg([r]);return `<details style="margin:4px 10px"><summary>${jfmt(r[0])} — ${fa(da[0])}٪</summary>${da[1]}</details>`}).join('')+'</details>'}).join('')+'</details>'}).join('')||'<p class="mu">هنوز آماری ثبت نشده است.</p>'}
render();wsync();
</script>
